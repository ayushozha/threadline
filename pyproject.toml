[project]
name = "threadline"
version = "0.1.0"
description = "Personal memory and grounded context for VexoHacks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "websockets>=13,<16",
  "pipecat-ai[deepgram,elevenlabs,websocket]>=1.16,<2",
  "tzdata>=2026.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
